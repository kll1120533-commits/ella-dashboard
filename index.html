<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>본사 웹디자인</title>
<style>
  :root{
    /* 구글/크롬(머티리얼) 색감 — 프로그램과 같은 톤 */
    --bg:#F8F9FA; --panel:#FFFFFF; --ink:#202124; --muted:#5F6368;
    --line:#E8EAED; --soft:#F1F3F4;
    --blue:#1A73E8; --blue2:#4285F4; --bluebg:#E8F0FE; --blueink:#1557B0;
    --up:#188038; --upbg:#E6F4EA; --down:#D93025; --downbg:#FCE8E6;
    --idle:#DADCE0;
    /* 노션처럼 '평평하게' — 그림자 거의 없이 얇은 테두리로만 구분 */
    --shadow:none;
    --shadow2:0 2px 8px rgba(60,64,67,.06);
    --radius:12px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font-family:"Roboto","Google Sans","맑은 고딕","Malgun Gothic",system-ui,-apple-system,sans-serif; }
  .wrap{ max-width:1120px; margin:0 auto; padding:26px 22px 64px; }
  .top{ display:flex; align-items:flex-end; justify-content:space-between;
        gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  h1{ font-size:24px; margin:0 0 3px; letter-spacing:-.3px; }
  .sub{ color:var(--muted); font-size:13px; }
  .ctrls{ display:flex; gap:8px; align-items:center; }
  .ctrls select{ font-size:13.5px; padding:9px 14px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); cursor:pointer; font-weight:600; }
  .ctrls select:hover{ border-color:var(--idle); }
  .ctrls select:focus{ outline:none; border-color:var(--blue); }
  .tabs{ display:flex; flex-wrap:wrap; gap:6px; background:#fff; border:1px solid var(--line);
         border-radius:12px; padding:6px; box-shadow:var(--shadow); margin-bottom:16px; }
  .tab{ padding:9px 15px; border-radius:10px; font-size:13px; font-weight:700;
        color:var(--muted); cursor:pointer; border:none; background:transparent; }
  .tab:hover{ background:var(--soft); }
  .tab.on{ background:var(--bluebg); color:var(--blue); }
  .vtabs{ display:flex; gap:4px; background:#fff; border:1px solid var(--line);
          border-radius:12px; padding:4px; box-shadow:var(--shadow); }
  .vtab{ padding:9px 16px; border-radius:9px; font-size:14px; font-weight:700;
         color:var(--muted); cursor:pointer; border:none; background:transparent; }
  .vtab:hover{ background:var(--soft); }
  .vtab.on{ background:var(--blue); color:#fff; }

  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:22px; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
         padding:20px 20px 18px; box-shadow:var(--shadow); position:relative;
         transition:box-shadow .16s ease, transform .16s ease; }
  .card:hover{ border-color:var(--idle); }
  .card .row1{ display:flex; align-items:center; justify-content:space-between; }
  .card .lab{ color:var(--muted); font-size:12.5px; font-weight:600; letter-spacing:.1px; }
  .ico{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center;
        justify-content:center; font-size:17px; background:var(--soft); }
  .card .val{ font-size:27px; font-weight:800; margin:14px 0 8px; letter-spacing:-.6px; }
  .delta{ display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:700;
          padding:3px 8px; border-radius:999px; }
  .delta.up{ color:var(--up); background:var(--upbg); }
  .delta.down{ color:var(--down); background:var(--downbg); }
  .delta.flat{ color:var(--muted); background:var(--soft); }
  .card .foot{ color:var(--muted); font-size:12px; margin-left:8px; }
  /* 총매출 카드: 그라데이션 대신 아주 옅은 파랑 톤 (평평하고 깔끔) */
  .card.primary{ background:var(--bluebg); border-color:#D2E3FC; }
  .card.primary .val{ color:var(--blueink); }
  .card.primary .lab{ color:var(--blueink); }

  .grid2{ display:grid; grid-template-columns:1.6fr 1fr; gap:18px; margin-bottom:22px; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
          padding:22px 22px 18px; box-shadow:var(--shadow); }
  .panel h2{ font-size:14.5px; font-weight:700; margin:0 0 2px; letter-spacing:-.1px; }
  .panel .ph{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; gap:12px; }
  .panel .pnote{ color:var(--muted); font-size:12px; }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:12px;
           color:#4B5563; justify-content:center; }
  .legend i{ display:inline-block; width:10px; height:10px; border-radius:3px;
             margin-right:6px; vertical-align:-1px; }

  .hb{ display:flex; flex-direction:column; gap:11px; margin-top:4px; }
  .hbrow{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .hbn{ width:76px; color:#374151; }
  .hbbar{ flex:1; background:var(--soft); border-radius:8px; height:18px; overflow:hidden; }
  .hbbar i{ display:block; height:100%; border-radius:8px; }
  .hbv{ width:118px; text-align:right; color:#374151; font-weight:600; }
  .muted{ color:var(--muted); font-size:13px; }

  table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  th,td{ padding:13px 12px; line-height:1.4; text-align:right; white-space:nowrap;
         border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:700; font-size:11.5px; letter-spacing:.3px;
      background:var(--soft); }
  th:first-child{ border-top-left-radius:10px; } th:last-child{ border-top-right-radius:10px; }
  tbody tr:last-child td, table tr:last-child td{ border-bottom:none; }
  #dtl tr:hover td{ background:#F7F9FC; }
  td.m,th.m{ text-align:center; font-weight:600; }
  td.l{ text-align:left; }
  td.rl,th.rl{ text-align:left; font-weight:700; background:var(--soft); color:#374151;
               position:sticky; left:0; z-index:1; }
  td.sumc,th.sumc{ background:var(--bluebg); font-weight:800; color:var(--blueink); }
  th.hl{ color:var(--blue); }
  tr.sum td{ background:var(--soft); font-weight:800; }
  tr.hl td{ background:var(--bluebg); }
  .pos{ color:var(--up); } .neg{ color:var(--down); }
  .scroll{ overflow-x:auto; }
  /* 월별 판매내역: 넓은 화면은 꽉 채우되, 최소너비를 줘서 좁아져도 숫자가 안 잘림.
     (그보다 더 좁아지면 .scroll 로 가로 스크롤 — 글자가 잘리는 것보단 낫게) */
  #dtl{ width:100%; min-width:1160px; table-layout:fixed; }
  #dtl th, #dtl td{ padding:9px 9px; font-size:12.5px; line-height:1.4; }
  #dtl td{ white-space:nowrap; }                 /* 날짜·코드·숫자는 안 쪼갬 */
  /* 3=판매내역, 10=비고1, 11=비고2 만 줄바꿈 */
  #dtl td:nth-child(3), #dtl td:nth-child(10), #dtl td:nth-child(11){
    white-space:normal; word-break:break-word; }
  #dtl col.c날{ width:6%; } #dtl col.c브{ width:7%; } #dtl col.c내{ width:15%; }
  #dtl col.c코{ width:7.2%; } #dtl col.c품{ width:5.2%; } #dtl col.c매{ width:8.2%; }
  #dtl col.c결{ width:8.6%; } #dtl col.c순{ width:8.2%; } #dtl col.c플{ width:6%; }
  #dtl col.c비1{ width:8.4%; } #dtl col.c비2{ width:7.4%; }
  #dtl col.c주{ width:3.6%; } #dtl col.c구{ width:4%; }
  .srch{ display:flex; align-items:center; gap:10px; margin:2px 0 12px; }
  .srch input{ flex:1; max-width:460px; font-size:13.5px; padding:10px 14px;
    border:1px solid var(--line); border-radius:10px; background:var(--soft);
    color:var(--ink); }
  .srch input:focus{ outline:none; border-color:var(--blue); background:#fff; }
  .xbtn{ font-size:13px; font-weight:700; padding:10px 15px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--blue); cursor:pointer;
    white-space:nowrap; transition:background .12s ease; }
  .xbtn:hover{ background:var(--bluebg); border-color:var(--blue2); }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:6px 0 10px; }
  .calh{ text-align:center; font-size:12px; font-weight:700; color:var(--muted); padding:4px 0; }
  .calh.sun{ color:var(--down); } .calh.sat{ color:var(--blue); }
  .cald{ min-height:46px; border:1px solid var(--line); border-radius:10px; padding:6px 8px;
    font-size:13px; color:var(--muted); background:#fff; }
  .cald.blank{ border:none; background:transparent; }
  .cald.has{ cursor:pointer; color:var(--ink); font-weight:700; border-color:var(--blue2); }
  .cald.has:hover{ background:var(--bluebg); }
  .cald.sel{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .cald .cnt{ display:block; font-size:10px; font-weight:600; margin-top:3px; }
  /* ── 사이드바 레이아웃 ── */
  .app{ display:flex; min-height:100vh; align-items:stretch; }
  .side{ width:232px; flex:0 0 232px; background:#fff; border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:22px 16px; position:sticky; top:0;
    height:100vh; }
  .brand{ font-size:18px; font-weight:800; letter-spacing:-.3px; padding:2px 8px 20px; }
  .nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-i{ text-align:left; padding:10px 14px; border-radius:10px; font-size:13.5px;
    font-weight:600; color:var(--muted); background:transparent; border:none; cursor:pointer;
    transition:background .12s ease, color .12s ease; }
  .nav-i:hover{ background:var(--soft); color:var(--ink); }
  .nav-i.on{ background:var(--bluebg); color:var(--blue); font-weight:700; }
  .side-foot{ margin-top:auto; font-size:11px; color:var(--muted); padding:14px 8px 0; line-height:1.7;
    border-top:1px solid var(--line); margin-top:auto; }
  .main{ flex:1 1 auto; min-width:0; padding:26px 34px 60px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .topbar h1{ font-size:22px; margin:0; letter-spacing:-.3px; }
  /* 달 선택 — 세그먼트 탭(연간·1월~12월). 눌린 달은 흰 알약으로 떠오름 */
  .mtabs{ display:flex; flex-wrap:wrap; gap:4px; background:var(--soft);
    border:1px solid var(--line); border-radius:12px; padding:5px; margin-bottom:22px; }
  .mtab{ padding:8px 15px; border-radius:9px; font-size:13px; font-weight:600;
    color:var(--muted); background:transparent; border:none; cursor:pointer;
    transition:background .12s ease, color .12s ease; }
  .mtab:hover{ color:var(--ink); }
  .mtab.on{ background:#fff; color:var(--blue); font-weight:700;
    box-shadow:0 1px 2px rgba(60,64,67,.14); }
  /* 비밀번호 잠금 화면 */
  #lockov{ position:fixed; inset:0; background:var(--bg); display:flex;
    align-items:center; justify-content:center; z-index:9999; }
  .lockbox{ width:320px; max-width:88vw; background:#fff; border:1px solid var(--line);
    border-radius:16px; padding:30px 26px; text-align:center;
    box-shadow:0 8px 30px rgba(60,64,67,.12); }
  .lockttl{ font-size:19px; font-weight:800; letter-spacing:-.3px; }
  .locksub{ color:var(--muted); font-size:13px; margin:6px 0 18px; }
  .lockbox input{ width:100%; font-size:15px; padding:12px 14px; border:1px solid var(--line);
    border-radius:10px; background:var(--soft); color:var(--ink); }
  .lockbox input:focus{ outline:none; border-color:var(--blue); background:#fff; }
  #lockgo{ width:100%; margin-top:12px; font-size:15px; font-weight:700; padding:12px;
    border:none; border-radius:10px; background:var(--blue); color:#fff; cursor:pointer; }
  #lockgo:hover{ background:var(--blue2); }
  .lockerr{ color:var(--down); font-size:12.5px; margin-top:10px; min-height:16px; }
  /* 디자인 작업 갤러리 */
  .dgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:12px; margin:4px 0 6px; }
  .dcell{ border:1px solid var(--line); border-radius:10px; overflow:hidden;
    cursor:zoom-in; aspect-ratio:1/1; background:var(--soft); }
  .dcell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .dcell:hover{ border-color:var(--blue2); }
  #imgov{ position:fixed; inset:0; background:rgba(20,22,25,.85); display:flex;
    align-items:center; justify-content:center; z-index:9998; cursor:zoom-out; padding:24px; }
  #imgov img{ max-width:92vw; max-height:92vh; border-radius:8px;
    box-shadow:0 10px 40px rgba(0,0,0,.4); }
  @media(max-width:860px){ .cards{ grid-template-columns:repeat(2,1fr);} .grid2{ grid-template-columns:1fr; } }
  @media(max-width:820px){
    .app{ flex-direction:column; }
    .side{ width:auto; flex:none; height:auto; position:static; flex-direction:column;
      border-right:none; border-bottom:1px solid var(--line); padding:14px; }
    .nav{ flex-direction:row; flex-wrap:wrap; }
    .nav-i{ padding:8px 12px; font-size:13px; }
    .side-foot{ display:none; }
    .main{ padding:18px 14px 50px; }
  }

  /* 보고용 인쇄 버튼 */
  .prbtn{ margin-left:8px; padding:7px 12px; border:1px solid #c9ced6;
          border-radius:8px; background:#fff; color:#2b2f36;
          font-size:13px; font-weight:600; cursor:pointer; }
  .prbtn:hover{ background:#f2f4f7; }

  /* ─── 보고용 인쇄 (화면에 보이는 그 섹션만 깔끔하게 종이로) ─── */
  @media print {
    @page { margin: 12mm; }
    /* 메뉴·월탭·버튼·잠금창 등 '종이에 필요 없는 것' 은 숨깁니다 */
    .side, .mtabs, .prbtn, .xbtn, #yearSel, #lockov { display:none !important; }
    .app { display:block !important; }
    .main { padding:0 !important; }
    .topbar { border:none !important; margin-bottom:8px; }
    /* 색·그래프(막대/달력 색)가 종이에도 그대로 나오게 */
    * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    /* 표·카드·그래프가 페이지 경계에서 잘리지 않게 */
    .panel, .card, table, tr, .dcell, .cald, svg {
      break-inside:avoid; page-break-inside:avoid; }
    .panel, .card, .sec { box-shadow:none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">본사 웹디자인</div>
    <nav class="nav">
      <button class="nav-i on" data-sec="요약" onclick="섹션('요약')">매출 요약</button>
      <button class="nav-i" data-sec="월별" onclick="섹션('월별')">월별 상세</button>
      <button class="nav-i" data-sec="주간" onclick="섹션('주간')">주간 매출</button>
      <button class="nav-i" data-sec="업무" onclick="섹션('업무')">업무보고</button>
      <button class="nav-i" data-sec="디자인" onclick="섹션('디자인')">디자인 작업</button>
    </nav>
    <div class="side-foot">만든 시각 2026-10-21 16:19<br>이 파일 하나로 어디서든 열려요 (공유용)
      <span id="liveBadge" style="color:#188038;font-weight:600"></span></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">매출 요약</h1>
      <div class="ctrls">
        <button class="prbtn" onclick="window.print()"
                title="지금 보이는 화면을 보고용으로 인쇄합니다">🖨 인쇄</button>
        <select id="yearSel"></select>
      </div>
    </header>

    <div class="mtabs" id="monthBar"></div>

    <section id="sec-요약" class="sec">
      <div class="cards" id="cards"></div>
      <div class="grid2">
        <div class="panel">
          <div class="ph"><h2 id="barTitle">매출 추이</h2><span class="pnote">막대를 누르면 그 달로</span></div>
          <div id="bar"></div>
        </div>
        <div class="panel">
          <div class="ph"><h2 id="hbTitle">플랫폼별 매출</h2></div>
          <div id="hb"></div>
        </div>
      </div>
      <div class="panel" style="margin-bottom:20px">
        <div class="ph"><h2>플랫폼별 매출 (월별 누적)</h2></div>
        <div id="stack"></div>
      </div>
    </section>

    <section id="sec-월별" class="sec" style="display:none">
      <div class="grid2">
        <div class="panel">
          <div class="ph"><h2 id="tbl1Title">매출 상세</h2><span class="pnote">위 '월' 에서 달 선택</span></div>
          <table id="tbl1"></table>
        </div>
        <div class="panel">
          <div class="ph"><h2 id="tbl2Title">플랫폼 매출</h2></div>
          <table id="tbl2"></table>
        </div>
      </div>
      <div class="panel" style="margin-bottom:20px">
        <div class="ph"><h2 id="dtlTitle">월별 판매내역</h2>
          <span class="pnote">위 '월' 에서 달을 고르면 그 달 판매내역 (매출표 그대로)</span></div>
        <div class="srch">
          <input id="dtlSearch" type="search" placeholder="코드·브랜드·상품·플랫폼·비고 검색 (예: A-B58796, 크림, 환불)" oninput="내역표()">
          <label style="margin:0 10px;white-space:nowrap;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px"><input type="checkbox" id="dtlOnlyD" onchange="내역표()"> 위탁 D코드만</label>
          <button class="xbtn" onclick="내역엑셀()">엑셀 내려받기</button>
          <span id="dtlCount" class="pnote"></span>
        </div>
        <div class="scroll"><table id="dtl"></table></div>
      </div>
    </section>

    <section id="sec-주간" class="sec" style="display:none">
      <div class="panel" style="margin-bottom:20px">
        <div class="ph"><h2 id="wkTitle">주간 매출표</h2>
          <span class="pnote">일요일에 한 주가 시작 (매출표와 같은 기준)</span></div>
        <div id="wk"></div>
      </div>
    </section>

    <section id="sec-업무" class="sec" style="display:none">
      <div class="panel" style="margin-bottom:20px">
        <div class="ph"><h2 id="kpiTitle">업무보고</h2></div>
        <div id="kpiBody"></div>
      </div>
    </section>

    <section id="sec-디자인" class="sec" style="display:none">
      <div class="panel" style="margin-bottom:20px">
        <div class="ph"><h2 id="designTitle">디자인 작업</h2>
          <span class="pnote">위 '월' 에서 달을 고르면 그 달 디자인물</span></div>
        <div id="designBody"></div>
      </div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

function 누적막대(){

  const W=1040,H=300,L=56,R=16,T=16,B=34, gw=W-L-R, gh=H-T-B;
  const 월합=[]; for(let i=0;i<12;i++){ let t=0; for(const p of 플랫폼) t+=플월[p][i]; 월합.push(t); }
  const g=눈금(Math.max(1,...월합)), 천장=Math.max(...g)||1, 칸=gw/12, bw=Math.min(30,칸*0.5);
  const y=v=>T+gh*(1-v/천장);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" font-size="11">`;
  for(const gv of g){ const yy=y(gv); s+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#F0F2F6"/><text x="${L-8}" y="${yy+4}" text-anchor="end" fill="#B6BCC6">${man(gv)}</text>`; }
  for(let i=0;i<12;i++){ const cx=L+칸*i+칸/2; s+=`<text x="${cx}" y="${H-12}" text-anchor="middle" fill="#9AA3AF">${달[i]}</text>`;
    let base=T+gh;
    플랫폼.forEach((p,pi)=>{ const v=플월[p][i]; if(v<=0) return; const h=gh*v/천장;
      s+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(base-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${색판[pi%색판.length]}"/>`; base-=h; }); }
  s+="</svg>";

  document.getElementById("stack").innerHTML=s;
}

// ★ 지금 보고 있는 '월별 판매내역'(달·검색 반영)을 엑셀(CSV)로 내려받기
function _보일내역(){ const d=DATA.data[년]; if(!d) return [];
  let rows=(d.내역||[]).filter(r=> 보기>0 ? r.월===보기 : true);
  const 박스=document.getElementById("dtlSearch");
  const q=(박스? 박스.value:"").trim().toLowerCase();
  if(q){ rows=rows.filter(r=>[r.날,r.브,r.내,r.코,r.품,r.플,r.비1,r.비2,r.구].join(" ").toLowerCase().includes(q)); }
  const dOnly=document.getElementById("dtlOnlyD");
  if(dOnly && dOnly.checked){ rows=rows.filter(r=>(r.코||"").trim().toUpperCase().startsWith("D")); }
  return rows.slice().sort((a,b)=> (a.날>b.날?1:(a.날<b.날?-1:0)));
}
function _csv(v){ v=(v==null?"":String(v));
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function 내역엑셀(){
  const rows=_보일내역();
  if(!rows.length){ alert("내려받을 내역이 없어요."); return; }
  const 머리=["판매날짜","브랜드","판매내역","코드","품목","매입가","결제금액","순수익","플랫폼","비고1","비고2","주차","구분"];
  const aoa=[머리];
  for(const r of rows){
    aoa.push([r.날,r.브,r.내,r.코,r.품,(r.매||0),(r.결||0),(r.순||0),r.플,(r.비1||""),(r.비2||""),r.주,r.구]);
  }
  const 이름="매출내역_"+년+(보기>0?("_"+보기+"월"):"_전체");
  // 진짜 엑셀(.xlsx) 로 — SheetJS 를 못 불러왔으면 CSV 로 대신 받습니다.
  if(window.XLSX){
    try{
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols']=[{wch:12},{wch:14},{wch:32},{wch:12},{wch:8},{wch:12},
                   {wch:12},{wch:12},{wch:10},{wch:16},{wch:14},{wch:7},{wch:6}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, (보기>0?(보기+"월"):"전체"));
      XLSX.writeFile(wb, 이름+".xlsx");
      return;
    }catch(e){}
  }
  // ── 대비책: CSV (엑셀에서 열림, 한글 깨짐 방지 BOM) ──
  const csv="﻿"+aoa.map(function(row){ return row.map(_csv).join(","); }).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=이름+".csv";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  if(rows.length){

  const k=kpiData();
  if(ttl) ttl.textContent=(보기>0?(보기+"월 "):(년+"년 "))+"업무보고";
  if(!k || !k.월 || !Object.keys(k.월).length){
    host.innerHTML="<div class='muted' style='padding:10px 2px'>아직 업무보고가 없어요. 프로그램 [업무 보고 → 오늘 업무보고] 에서 쓰고 저장하면 여기에 날짜별로 떠요.</div>";
    return; }

  let h="";

  // (달을 고른 경우) 담당자×항목 수량 표
  if(보기>0){
    const md=k.월[String(보기)];
    const 담당 = md ? k.담당자.filter(p=>md.표 && md.표[p]) : [];
    const 항목 = md ? k.항목.filter(it=>(md.합계||{})[it]) : [];
    if(담당.length && 항목.length){
      h+="<h2 style='font-size:14.5px;margin:0 0 10px'>"+보기+"월 성과 (담당자 × 항목)</h2>";
      h+="<div class='scroll'><table><tr><th class='rl'>담당자</th>"
        + 항목.map(it=>`<th>${esc(it)}</th>`).join("") + "</tr>";
      for(const p of 담당){ const 줄=md.표[p]||{};
        h+=`<tr><td class='rl'>${esc(p)}</td>`
          + 항목.map(it=>{ const v=줄[it]||0, 목=k.목표[it]||0;
              const cls = (목 && v>=목) ? "pos" : "";
              return `<td class='${cls}'>${v?v.toLocaleString():'-'}</td>`; }).join("")
          + "</tr>"; }
      h+=`<tr class='sum'><td class='rl'>합계</td>`
        + 항목.map(it=>`<td>${((md.합계||{})[it]||0).toLocaleString()}</td>`).join("") + "</tr>";
      h+=`<tr><td class='rl'>월 목표</td>`
        + 항목.map(it=>`<td class='muted'>${k.목표[it]?k.목표[it].toLocaleString():'-'}</td>`).join("") + "</tr>";
      h+="</table></div>";
    }
  }

  // ✍️ 일일 업무보고 — 달력에서 날짜를 누르면 그날 담당자별 보고가 나와요.
  const 달월 = _kpiMonthOf();
  const md2 = k.월[String(달월)] || {};
  const 일일 = md2.일일 || {};
  // 📝 이 달 '업무 메모'(자유 입력) — 쓰면 여기에 그대로 보입니다.
  if(md2 && md2.메모){
    h+="<div class='panel' style='margin:"+(보기>0?"18px":"2px")+" 0 14px'>"
      +"<div class='ph'><h2 style='font-size:14px;margin:0'>📝 "+년+"년 "+달월+"월 업무 메모</h2></div>"
      +"<div style='white-space:pre-wrap;line-height:1.65;padding:4px 2px'>"+esc(md2.메모)+"</div></div>";
  }
  h+="<h2 style='font-size:14.5px;margin:"+(보기>0?"18px":"2px")+" 0 10px'>"
    + 년 + "년 " + 달월 + "월 업무보고 — 날짜를 누르면 그날 보고가 나와요</h2>";
  h+=_달력HTML(+년, 달월, 일일);
  // 선택한 날이 이 달이 아니면, 이 달에서 '보고 있는 마지막 날' 로 맞춥니다.
  const 달머리 = 년 + "-" + String(달월).padStart(2,"0");
  const 있는날 = Object.keys(일일).sort();
  if(!_kpiSel || _kpiSel.slice(0,7)!==달머리){
    _kpiSel = 있는날.length ? 있는날[있는날.length-1] : null;
  }
  h+="<div style='margin-top:8px'>"+_날보고HTML(_kpiSel, 일일)+"</div>";
  host.innerHTML=h;
}

// 업무보고 달력에 쓸 '달' 을 정합니다. (달 탭을 고르면 그 달, 연간이면 자료 있는 마지막 달)
function _kpiMonthOf(){
  if(보기>0) return 보기;
  const k=kpiData();
  if(k && k.월){
    const ms=Object.keys(k.월)
      .filter(m=>k.월[m].일일 && Object.keys(k.월[m].일일).length).map(Number);
    if(ms.length) return Math.max.apply(null, ms);
  }
  return (new Date()).getMonth()+1;
}
function _kpiDay(d){ _kpiSel=d; renderKpi(); }

function _달력HTML(y, m, 일일){
  const 요일=["일","월","화","수","목","금","토"];
  const first=new Date(y, m-1, 1).getDay();      // 0=일요일
  const days=new Date(y, m, 0).getDate();
  let g="<div class='cal'>";
  g+=요일.map((w,i)=>`<div class='calh ${i===0?'sun':(i===6?'sat':'')}'>${w}</div>`).join("");
  for(let i=0;i<first;i++) g+="<div class='cald blank'></div>";
  for(let d=1; d<=days; d++){
    const ds=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    const hd=일일[ds];
    if(hd && Object.keys(hd).length){
      const n=Object.keys(hd).length;
      const sel=(_kpiSel===ds)?" sel":"";
      g+=`<div class='cald has${sel}' onclick="_kpiDay('${ds}')">${d}<span class='cnt'>${n}명</span></div>`;
    } else {
      g+=`<div class='cald'>${d}</div>`;
    }
  }
  g+="</div>";
  return g;
}

function _날보고HTML(sel, 일일){
  if(!sel || !일일[sel]){
    return "<div class='muted' style='padding:8px 2px'>위 달력에서 색칠된(업무보고 있는) 날짜를 누르면, 그날 담당자별로 뭘 했는지 나와요.</div>";
  }
  const hd=일일[sel];
  let h="<h3 style='font-size:13.5px;margin:14px 0 8px;color:var(--blue)'>"+esc(sel)+" 업무보고</h3>";
  for(const who in hd){
    const items=hd[who]||[]; let li="";
    for(const it of items){ const done=it&&it.됨;
      li+=`<div style='margin:2px 0;color:${done?'#8A8F96':'var(--ink)'}'>${done?'☑':'☐'} <span style='${done?'text-decoration:line-through':''}'>${esc(it&&it.글||"")}</span></div>`; }
    h+=`<div style='margin:4px 0;padding:10px 12px;background:var(--soft);border-radius:8px'><b>${esc(who)}</b>${li}</div>`;
  }
  return h;
}

function _연옵션(){ const ys=document.getElementById("yearSel");
  if(!DATA.data[년]) 년=String(DATA.years[DATA.years.length-1]);
  ys.innerHTML=DATA.years.map(y=>`<option value="${y}">${y}년</option>`).join(""); ys.value=년; }

function _부팅(){
  년 = String(DATA.years[DATA.years.length-1]);
  const ys=document.getElementById("yearSel");
  _연옵션();
  ys.onchange=()=>{ 년=ys.value; 그리기(); };
  섹션("요약");
}

// ── 비밀번호가 걸려 있으면: 먼저 비번을 받아 데이터를 풀고 시작 ──
async function _복호화(비번){
  const b64=s=>Uint8Array.from(atob(s), c=>c.charCodeAt(0));
  const bk=await crypto.subtle.importKey("raw", new TextEncoder().encode(비번),
    "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.it, hash:"SHA-256"},
    bk, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
const _PWKEY="웹공유_비번_1";   // 이 '탭' 에서만 기억 (창 닫으면 사라짐)
function _잠금화면(){
  const ov=document.createElement("div"); ov.id="lockov";
  ov.innerHTML=`<div class="lockbox">
    <div class="lockttl">본사 웹디자인</div>
    <div class="locksub">이 대시보드는 비밀번호가 필요합니다.</div>
    <input id="lockpw" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="lockgo">열기</button>
    <div id="lockerr" class="lockerr"></div></div>`;
  document.body.appendChild(ov);
  const pw=document.getElementById("lockpw"), go=document.getElementById("lockgo"),
        er=document.getElementById("lockerr");
  async function 시도(){ er.textContent="";
    try{ DATA=await _복호화(pw.value||"");
      try{ sessionStorage.setItem(_PWKEY, pw.value||""); }catch(e){}  // 이 창에서 기억
      ov.remove(); _부팅(); }
    catch(e){ er.textContent="비밀번호가 틀렸어요. 다시 입력해 주세요."; pw.value=""; pw.focus(); } }
  go.onclick=시도; pw.onkeydown=e=>{ if(e.key==="Enter") 시도(); };
  pw.focus();
}
// ── 이 창(탭)에서 이미 비번을 맞췄으면, 새로고침해도 다시 안 묻습니다.
//    (창/탭을 닫으면 기억이 사라져서, 다음에 열 땐 다시 물어봅니다)
async function _자동해제(){
  let 저장="";
  try{ 저장=sessionStorage.getItem(_PWKEY)||""; }catch(e){}
  if(!저장) return false;
  try{ DATA=await _복호화(저장); _부팅(); return true; }
  catch(e){ try{ sessionStorage.removeItem(_PWKEY); }catch(_){} return false; }
}
(function(){
  if(ENC){ _자동해제().then(ok=>{ if(!ok) _잠금화면(); }); }
  else { _부팅(); }
})();

// ── 들어오자마자 '최신인지' 확인해서, 더 최신이 올라와 있으면 한 번 자동 새로고침 ──
//   (브라우저·GitHub 캐시 때문에 옛 버전이 먼저 보이는 걸 막습니다.
//    무한 반복 방지로, 같은 새 버전으로는 딱 한 번만 새로고침합니다.)
(function(){
  setTimeout(async function(){
    try{
      const r = await fetch(location.pathname + "?_=" + Date.now(), {cache:"no-store"});
      if(!r.ok) return;
      const t = await r.text();
      const m = t.match(/빌드ID\s*=\s*"([^"]+)"/);
      const 새 = m ? m[1] : "";
      if(새 && 새 !== 빌드ID){
        let 이미 = "";
        try{ 이미 = sessionStorage.getItem("_마지막빌드")||""; }catch(e){}
        if(이미 !== 새){
          try{ sessionStorage.setItem("_마지막빌드", 새); }catch(e){}
          location.reload();
        }
      }
    }catch(e){}
  }, 1000);
})();

// ── 실시간 갱신: 데이터 파일을 주기적으로 다시 읽어, 바뀌었으면 다시 그립니다 ──
//   (프로그램이 저장할 때마다 데이터 파일이 바뀌고, 열어둔 화면은 자동 반영)
function _데이터다시읽기(){
  if(!DATA_FILE) return;
  const s=document.createElement("script");
  s.src=DATA_FILE+"?t="+Date.now();
  s.onload=function(){ s.remove();
    try{
      if(window.DASH && window.DASH_time && window.DASH_time!==_lastTime){
        _lastTime=window.DASH_time; DATA=window.DASH; _연옵션(); 그리기();
        const b=document.getElementById("liveBadge");
        if(b) b.textContent="● 업데이트됨 "+_lastTime.slice(11,16);
      }
    }catch(e){}
  };
  s.onerror=function(){ s.remove(); };
  document.body.appendChild(s);
}
setInterval(_데이터다시읽기, 15000);
</script>
