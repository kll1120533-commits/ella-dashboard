<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>엘라 — 제품 관리</title><style>
:root{--bg:#F5F6F8;--panel:#fff;--ink:#1B1C1F;--muted:#8A909A;--faint:#B7BCC4;--line:#ECEEF1;--soft:#F3F4F6;--accent:#5B5BD6;--accent-soft:#EEEEFD;--ok:#16A34A;--warn:#E0922F;--warn-bg:#FBF2E4;--red:#DC2626;--radius:16px;--shadow:0 1px 2px rgba(20,22,30,.04),0 6px 18px rgba(20,22,30,.05);}
*{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:26px;}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
.brand b{font-size:15.5px;}.brand span{display:block;font-size:11px;color:var(--muted);}
.nav{display:flex;flex-direction:column;gap:3px;}.nav .lbl{font-size:11px;color:var(--faint);font-weight:700;padding:6px 10px 4px;}
.nav a{display:block;padding:10px 12px;border-radius:11px;color:var(--muted);font-size:13.5px;font-weight:600;text-decoration:none;}.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--soft);}.foot .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#C9A7E8,#9B7CF0);}.foot small{display:block;color:var(--muted);font-size:11px;}.foot b{font-size:12.5px;}
.main{padding:22px 28px 60px;}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}.topbar h1{font-size:21px;margin:0;}.sub{color:var(--muted);font-size:12.5px;margin-top:3px;}
.search{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 14px;width:240px;color:var(--muted);}.search input{border:0;outline:0;background:transparent;font-size:13px;flex:1;font-family:inherit;}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow);}.stat .t{color:var(--muted);font-size:12px;}.stat .v{font-size:22px;font-weight:800;margin-top:6px;}.stat .d{font-size:11px;margin-top:4px;color:var(--muted);}
.frow{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}.flbl{font-size:11px;color:var(--faint);font-weight:700;width:48px;}
.chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);}
.chip.g.on{background:#0F766E;border-color:#0F766E;}.chip.c.on{background:var(--accent);border-color:var(--accent);}
select{font-size:12.5px;font-weight:600;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:8px;}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
.thumb{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden;}.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pill{position:absolute;top:10px;left:10px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;}.pill.sell{background:rgba(255,255,255,.92);color:var(--ok);}.pill.done{background:rgba(28,29,33,.72);color:#fff;}
.gtag{position:absolute;top:10px;right:10px;padding:4px 9px;border-radius:999px;font-size:10.5px;font-weight:800;background:rgba(15,118,110,.92);color:#fff;}
.dim{position:absolute;inset:0;background:rgba(20,22,30,.34);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
.pbody{padding:12px 14px 14px;}.nm{font-size:13.5px;font-weight:700;line-height:1.35;height:37px;overflow:hidden;}.cd{font-size:11.5px;color:var(--faint);font-weight:700;margin-top:4px;}
.meta{display:flex;gap:6px;margin-top:8px;}.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);}
.chrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}.ch{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;}
.ch.home{background:#EAF1FE;color:#2563EB;}.ch.gu{background:#FDEEE9;color:#D1561F;}.ch.sik{background:#EAF7F0;color:#157F52;}.ch.none{background:var(--soft);color:var(--faint);}
.empty{color:var(--muted);padding:40px;text-align:center;}.madetime{color:var(--faint);font-size:11px;margin-top:20px;}
#lockov{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:99;}
.lockbox{width:320px;max-width:88vw;background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow);text-align:center;}
.lockttl{font-size:19px;font-weight:800;}.locksub{color:var(--muted);font-size:13px;margin:6px 0 18px;}
.lockbox input{width:100%;font-size:15px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;}
#lockgo{width:100%;margin-top:12px;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;}
.lockerr{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;}
@media(max-width:860px){.app{grid-template-columns:1fr;}.side{flex-direction:row;align-items:center;gap:12px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 14px;}.side .brand,.side .foot{flex:0 0 auto;}.side .nav{flex-direction:row;gap:4px;}.side .nav .lbl{display:none;}.side .nav a{white-space:nowrap;}.side .foot{margin-top:0;margin-left:auto;}.main{padding:18px 16px 50px;}.strip{grid-template-columns:repeat(2,1fr);}.grid{grid-template-columns:repeat(2,1fr);}.search{width:150px;}}
</style></head><body>

function _복호화(비번){
